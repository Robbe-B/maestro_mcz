[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --disable-socket --allow-unix-socket"

[tool.coverage.run]
branch = true
source = ["custom_components.maestro_mcz"]

[tool.coverage.report]
show_missing = true
skip_empty = true
precision = 2
fail_under = 97
