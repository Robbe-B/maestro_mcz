name: Cloud regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Run cloud regression tests with branch coverage
        run: >-
          python -m pytest
          -c tests/pyproject.toml
          --rootdir=.
          --cov=custom_components.maestro_mcz
          --cov-config=tests/pyproject.toml
          --cov-report=term-missing
          --cov-report=xml
          --cov-report=html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-coverage
          path: |
            coverage.xml
            htmlcov/
